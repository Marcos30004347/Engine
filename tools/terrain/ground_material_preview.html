<!doctype html>
<meta charset="utf-8">
<title>City ground materials — GPU validation</title>
<style>
body{margin:0;background:#e9e3d5;color:#302b23;font:15px system-ui}header{padding:16px 22px;display:flex;gap:24px;align-items:center}canvas{width:100%;height:calc(100vh - 64px);display:block}button{padding:6px 12px}#status{margin-left:auto}input{width:110px}
</style>
<header><strong>Street → block → lot · grass / earth / stone</strong>
<label>Orbit <input id="yaw" type="range" min="-3.14" max="3.14" step=".01" value="-.72"></label>
<label>Elevation <input id="pitch" type="range" min=".08" max="1.5" step=".01" value=".62"></label>
<label><input id="weights" type="checkbox" style="width:auto">Weights</label>
<button id="save">Save PNG</button><span id="status">Loading…</span></header>
<canvas id="view"></canvas>
<script type="module">
// Independent GPU validation client for the native mesh contract. It does not
// replace the engine's virtual-geometry upload/material-binding integration.
const canvas=document.querySelector('#view'),status=document.querySelector('#status');
const gl=canvas.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true});
try {
if(!gl)throw Error('WebGL2 unavailable');
const shader=(type,source)=>{const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;};
const program=gl.createProgram();
gl.attachShader(program,shader(gl.VERTEX_SHADER,`#version 300 es
precision highp float;
layout(location=0) in vec3 position;layout(location=1) in vec2 uv;
layout(location=2) in vec3 weights;layout(location=3) in vec3 normal;
uniform vec3 centre;uniform vec2 scale;uniform vec2 orbit;uniform float depthScale;
out vec2 vUV;out vec3 vWeights;out vec3 vNormal;
void main(){vec3 p=position-centre;float cy=cos(orbit.x),sy=sin(orbit.x),cp=cos(orbit.y),sp=sin(orbit.y);
float x=p.x*cy-p.z*sy,z=p.x*sy+p.z*cy;
gl_Position=vec4(x*scale.x,(p.y*sp-z*cp)*scale.y,-(z*sp+p.y*cp)*depthScale,1.);
vUV=uv;vWeights=weights;vNormal=normal;}`));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`#version 300 es
precision highp float;
in vec2 vUV;in vec3 vWeights;in vec3 vNormal;out vec4 color;
uniform sampler2D tex0;uniform sampler2D tex1;uniform sampler2D tex2;
uniform bool ground;uniform bool textured;uniform bool debugWeights;
uniform vec3 albedo;uniform vec2 repeat0;uniform vec2 repeat1;uniform vec2 repeat2;
vec3 linearize(vec3 x){return mix(x/12.92,pow((x+.055)/1.055,vec3(2.4)),step(vec3(.04045),x));}
vec3 encode(vec3 x){return mix(x*12.92,1.055*pow(max(x,vec3(0)),vec3(1./2.4))-.055,step(vec3(.0031308),x));}
void main(){vec3 result;
if(ground){vec3 w=max(vWeights,vec3(0));w/=max(dot(w,vec3(1)),.000001);
result=linearize(texture(tex0,vUV/repeat0).rgb)*w.x+linearize(texture(tex1,vUV/repeat1).rgb)*w.y+linearize(texture(tex2,vUV/repeat2).rgb)*w.z;
if(debugWeights){color=vec4(w,1);return;}
}else{result=linearize(albedo*(textured?texture(tex0,vUV/repeat0).rgb:vec3(1)));}
float light=ground?1.:.48+.52*abs(dot(normalize(vNormal),normalize(vec3(-.4,.8,-.3))));
color=vec4(encode(result*light),1);}`));
gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const U=name=>gl.getUniformLocation(program,name);
const meshURL=new URLSearchParams(location.search).get('mesh')||'/build/renders/ground-materials/neighbourhood.json';
const response=await fetch(meshURL);if(!response.ok)throw Error('Missing native mesh: '+meshURL);const mesh=await response.json();
const manifestURL='/'+mesh.textureManifest;const manifest=await(await fetch(manifestURL)).json();
const textures=new Map();
for(const [id,m]of Object.entries(manifest.materials))if(m.texture){
const im=new Image();im.src=new URL(m.texture,new URL(manifestURL,location.href));await im.decode();
const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);
gl.generateMipmap(gl.TEXTURE_2D);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
for(const axis of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,axis,m.wrap==='clamp'?gl.CLAMP_TO_EDGE:gl.REPEAT);textures.set(Number(id),t);}
// Fully bind unused sampler slots too; WebGL requires complete textures.
const fallback=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,fallback);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([255,255,255,255]));gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
const grouped=new Map();
for(let i=0;i<mesh.triangles.length;i++){
const tri=mesh.triangles[i],p=tri.map(k=>mesh.vertices[k]),w=mesh.vertexTextureWeights?tri.map(k=>mesh.vertexTextureWeights[k]):mesh.groundWeights?.[i]||[[0,0,0],[0,0,0],[0,0,0]];
const key=w[0].reduce((a,b)=>a+b,0)>.5?-1:mesh.surfaceMaterials[i];if(!grouped.has(key))grouped.set(key,[]);
const dest=grouped.get(key),a=p[1].map((v,k)=>v-p[0][k]),b=p[2].map((v,k)=>v-p[0][k]),n=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
for(let k=0;k<3;k++)dest.push(...p[k],...(mesh.triangleUVs?.[i]?.[k]||mesh.uvs?.[tri[k]]||[0,0]),...w[k],...n);
}
const batches=[];for(const [id,data]of grouped){const vao=gl.createVertexArray();gl.bindVertexArray(vao);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);
for(const [loc,count,offset]of [[0,3,0],[1,2,3],[2,3,5],[3,3,8]]){gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,count,gl.FLOAT,false,44,offset*4);}batches.push({id,vao,count:data.length/11});}
const lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];
const focus=mesh.infrastructureOnly?new Set(mesh.triangles.filter((t,i)=>![50,51,52].includes(mesh.materials[i])).flat()):null;
for(let i=0;i<mesh.vertices.length;i++){if(focus?.size && !focus.has(i))continue;const p=mesh.vertices[i];for(let k=0;k<3;k++){lo[k]=Math.min(lo[k],p[k]);hi[k]=Math.max(hi[k],p[k]);}}
const centre=lo.map((v,k)=>(v+hi[k])/2);gl.uniform3fv(U('centre'),centre);
const draw=()=>{canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.914,.890,.835,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);
const yaw=Number(document.querySelector('#yaw').value),pitch=Number(document.querySelector('#pitch').value);let ex=0,ey=0,ez=0;
for(const x of [lo[0]-centre[0],hi[0]-centre[0]])for(const y of [lo[1]-centre[1],hi[1]-centre[1]])for(const z of [lo[2]-centre[2],hi[2]-centre[2]]){const a=x*Math.cos(yaw)-z*Math.sin(yaw),b=x*Math.sin(yaw)+z*Math.cos(yaw);ex=Math.max(ex,Math.abs(a));ey=Math.max(ey,Math.abs(y*Math.sin(pitch)-b*Math.cos(pitch)));ez=Math.max(ez,Math.abs(b*Math.sin(pitch)+y*Math.cos(pitch)));}
const s=.92*Math.min(canvas.width/(2*ex),canvas.height/(2*ey));gl.uniform2f(U('scale'),2*s/canvas.width,2*s/canvas.height);gl.uniform2f(U('orbit'),yaw,pitch);gl.uniform1f(U('depthScale'),.95/Math.max(ez,1));gl.uniform1i(U('debugWeights'),document.querySelector('#weights').checked);
for(const batch of batches){const ground=batch.id===-1,m=manifest.materials[batch.id]||{color:[180,170,150]},ids=ground?mesh.groundMaterialIds:[batch.id,0,0];
gl.uniform1i(U('ground'),ground);gl.uniform1i(U('textured'),textures.has(batch.id));gl.uniform3fv(U('albedo'),m.texture?(m.tint||[1,1,1]):m.color.map(x=>x/255));
for(let k=0;k<3;k++){const r=manifest.materials[ids[k]]||{};gl.activeTexture(gl.TEXTURE0+k);gl.bindTexture(gl.TEXTURE_2D,textures.get(ids[k])||fallback);gl.uniform1i(U('tex'+k),k);gl.uniform2fv(U('repeat'+k),r.repeatMetres||[1,1]);}
gl.bindVertexArray(batch.vao);gl.drawArrays(gl.TRIANGLES,0,batch.count);}
const error=gl.getError();if(error)throw Error('GPU error '+error);status.textContent=`${mesh.buildings.length} buildings · ${mesh.triangles.length.toLocaleString()} triangles · GPU blend`;window.previewReady=true;
};
for(const id of ['yaw','pitch','weights'])document.querySelector('#'+id).oninput=draw;window.onresize=draw;
document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.download='ground-materials-gpu.png';a.href=canvas.toDataURL();a.click();};draw();
}catch(e){status.textContent=e.message;window.previewError=e.message;console.error(e);}
</script>
