[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-neural-bilateral-grid-denoiser"
version = "0.1.0"
description = "Stateless mask-aware neural bilateral-grid training tools"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]
export = ["onnx>=1.16", "onnxscript>=0.2"]

[project.scripts]
ssr-train = "ssr.train:main"
ssr-export = "ssr.export:main"
ssr-pack-frame = "ssr.pack_frame:main"
ssr-generate-dataset = "ssr.generate_dataset:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
